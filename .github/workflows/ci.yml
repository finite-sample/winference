name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: winference
      # The reusable default matrix starts at 3.11, which cannot resolve against
      # this package's requires-python >= 3.12.
      python-versions: '["3.12", "3.14"]'
      coverage-floor: 90
      run-preen: true
